<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Form Link Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Basic reset and body styling */
        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #FDEEDC; /* Warm background */
            padding: 20px;
            box-sizing: border-box;
        }

        /* Container for the content - MODIFIED FOR CENTERING */
        .content-container {
            padding: 40px;
            background-color: #FFFFFF;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
           /* text-align: center; <-- Removed */
            max-width: 500px;
            width: 100%;
            /* --- ADDED FLEXBOX FOR CENTERING ITEMS --- */
            display: flex;
            flex-direction: column; /* Stack items vertically */
            align-items: center; /* Center items horizontally */
            /* --- END ADDED FLEXBOX --- */
        }

        /* Styling for the text above the button - ADDED text-align */
        .description-text {
            font-size: 1.2em;
            color: #4A4A4A;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 500;
            text-align: center; /* Ensure text itself is centered */
        }

        /* === Button (Button 63) Styles Start === */
        /* Applied to the <a> tag */
        a.button-63 {
          align-items: center;
          background-image: linear-gradient(144deg,#AF40FF, #5B42F3 50%,#00DDEB);
          border: 0;
          border-radius: 8px;
          box-shadow: rgba(151, 65, 252, 0.2) 0 15px 30px -5px;
          box-sizing: border-box;
          color: #FFFFFF;
          display: flex;
          font-family: 'Quicksand', sans-serif;
          font-size: 20px;
          font-weight: 700;
          justify-content: center;
          line-height: 1em;
          max-width: 300px; /* You can keep or adjust this */
          min-width: 140px;
          padding: 19px 24px;
          text-decoration: none;
          user-select: none;
          -webkit-user-select: none;
          touch-action: manipulation;
          white-space: nowrap;
          cursor: pointer;
          transition: all 0.3s ease;
        }

        a.button-63:active,
        a.button-63:hover {
          outline: 0;
        }

        a.button-63:hover {
            filter: brightness(1.15);
            box-shadow: rgba(151, 65, 252, 0.3) 0 18px 35px -7px;
            transform: translateY(-2px);
        }


        @media (min-width: 768px) {
          a.button-63 {
            font-size: 24px;
            min-width: 196px;
          }
        }
        /* === Button (Button 63) Styles End === */

        /* Styling for the text below the button - ADDED text-align and margin-top */
        .description-text-below-button {
            font-size: 1em;
            color: #4A4A4A;
            margin-top: 30px; /* Add space above this text */
            margin-bottom: 0; /* Remove bottom margin unless needed */
            line-height: 1.6;
            font-weight: 500;
            text-align: center; /* Ensure text itself is centered */
        }

    </style>
</head>
<body>

    <div class="content-container">
        <p class="description-text">
            Drop @username of your favorite people here and I’ll send a virtual hug to them on Twitter!🤗
             </p>

        <a href="#" class="button-63" role="button"> Open Google Form
        </a>

        <p class="description-text-below-button">
            {do not submit @s of users who post nude stuff ; i don't wanna get shadowbanned, sorry}
             </p>

    </div>

</body>
</html>
